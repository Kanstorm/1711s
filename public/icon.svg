  <circle cx="256" cy="256" r="185" fill="none" stroke="#D4AF37" stroke-width="6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="2"/>
  <!-- compass diamonds breaking the ring -->
